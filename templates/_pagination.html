{% if pagination and pagination.pages > 1 %}
<nav aria-label="pagination" class="mt-3">
    <ul class="pagination pagination-sm mb-0">
        <li class="page-item {{ 'disabled' if not pagination.has_prev }}">
            <a class="page-link" href="{{ url_for(endpoint) }}{% if pagination_qs %}?{{ pagination_qs }}&{% else %}?{% endif %}page={{ pagination.prev_num }}">قبلی</a>
        </li>
        {% for p in pagination.iter_pages(left_edge=1, right_edge=1, left_current=2, right_current=2) %}
            {% if p %}
                <li class="page-item {{ 'active' if p == pagination.page }}">
                    <a class="page-link" href="{{ url_for(endpoint) }}{% if pagination_qs %}?{{ pagination_qs }}&{% else %}?{% endif %}page={{ p }}">{{ p }}</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">…</span></li>
            {% endif %}
        {% endfor %}
        <li class="page-item {{ 'disabled' if not pagination.has_next }}">
            <a class="page-link" href="{{ url_for(endpoint) }}{% if pagination_qs %}?{{ pagination_qs }}&{% else %}?{% endif %}page={{ pagination.next_num }}">بعدی</a>
        </li>
    </ul>
</nav>
{% endif %}
